#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "linkwarden"
name = "Linkwarden"
description.en = "Collaborative bookmark manager to collect, organize and archive webpages"
description.fr = "Gestionnaire de signets collaboratif pour collecter, organiser et archiver les pages Web"

version = "2.10.0~ynh1"

maintainers = [ "Lapineige" ]

[upstream]
license = "AGPL-3.0-only"
website = "https://linkwarden.app/"
admindoc = "https://docs.linkwarden.app/self-hosting/installation"
userdoc = "https://docs.linkwarden.app/Usage/overview"
code = "https://github.com/linkwarden/linkwarden"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = true

disk = "50M"
ram.build = "1500M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/linkwarden/linkwarden/archive/refs/tags/v2.13.5.tar.gz"
    sha256 = "c52cfd4453653775df12ca4f9e4be3cb1dca3921c66ff27be35f52381a91b98e"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql, postgresql-contrib"

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "22"
