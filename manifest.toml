#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "linkwarden"
name = "Linkwarden"
description.en = "Collaborative bookmark manager to collect, organize and archive webpages"
description.fr = "Gestionnaire de signets collaboratif pour collecter, organiser et archiver les pages Web"

version = "2.14.1~ynh1"

maintainers = [ "Lapineige" ]

[upstream]
license = "AGPL-3.0-only"
website = "https://linkwarden.app/"
admindoc = "https://docs.linkwarden.app/self-hosting/installation"
userdoc = "https://docs.linkwarden.app/Usage/overview"
code = "https://github.com/linkwarden/linkwarden"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = true

disk = "50M"
ram.build = "1500M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/linkwarden/linkwarden/archive/refs/tags/v2.14.1.tar.gz"
    sha256 = "3aed043fe810e00529b432263872846b90d8f054a9cea50f5e3bcc835b8ad63b"
    autoupdate.strategy = "latest_github_release"

    [resources.sources.monolith]
    amd64.url = "https://github.com/Y2Z/monolith/releases/download/v2.10.1/monolith-gnu-linux-x86_64"
    amd64.sha256 = "663ca914b078e91d5a854b4a07e913c613bbbcfe8fb11a24da1a6ab23c9205df"
    am64.autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql, postgresql-contrib"

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "20"
