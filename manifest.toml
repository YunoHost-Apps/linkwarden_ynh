#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "linkwarden"
name = "Linkwarden"
description.en = "Collaborative bookmark manager to collect, organize and archive webpages"
description.fr = "Gestionnaire de signets collaboratif pour collecter, organiser et archiver les pages Web"

version = "2.16.1~ynh1"

maintainers = [ "Lapineige" ]

[upstream]
license = "AGPL-3.0-only"
website = "https://linkwarden.app/"
admindoc = "https://docs.linkwarden.app/self-hosting/installation"
userdoc = "https://docs.linkwarden.app/Usage/overview"
code = "https://github.com/linkwarden/linkwarden"

[integration]
yunohost = ">= 12.1.40"
helpers_version = "2.1"
architectures =  ["amd64", "arm64", "armhf"]
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "2500M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]

    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/linkwarden/linkwarden/archive/refs/tags/v2.16.1.tar.gz"
    sha256 = "24fb4b8ef849befaaacd6248c3fc2ee4dde338b8bd27318ab7623afb2857fe80"
    autoupdate.strategy = "latest_github_release"

    [resources.sources.monolith]
    amd64.url = "https://github.com/Y2Z/monolith/releases/download/v2.10.1/monolith-gnu-linux-x86_64"
    amd64.sha256 = "663ca914b078e91d5a854b4a07e913c613bbbcfe8fb11a24da1a6ab23c9205df"
    amd64.autoupdate.strategy = "latest_github_release"

    arm64.url = "https://github.com/Y2Z/monolith/releases/download/v2.10.1/monolith-gnu-linux-aarch64"
    arm64.sha256 = "7f8cac6291b4015b24b964fcdf115a196abecc59e9149f7aa485175943f99997"
    arm64.autoupdate.strategy = "latest_github_release"

    armhf.url = "https://github.com/Y2Z/monolith/releases/download/v2.10.1/monolith-gnu-linux-armhf"
    armhf.sha256 = "5e0ee3c64c5a711de814fad5af9c4a20eab1d13770dabd438d963933ee12c7ef"
    armhf.autoupdate.strategy = "latest_github_release"
    
    extract = false

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]

    [resources.apt]
    packages = "postgresql, postgresql-contrib"

    [resources.database]
    type = "postgresql"

    [resources.nodejs]
    version = "24"
